<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VõtmeValvur Pro Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: white; padding: 20px; }
        .btn { background: #00adb5; border: none; color: white; padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; margin-top: 20px; }
        .status-box { margin: 30px auto; padding: 20px; width: 80%; max-width: 400px; border-radius: 12px; background: #222831; border: 2px solid #393e46; }
        #rssi-val { font-size: 48px; font-weight: bold; color: #00adb5; }
        .alarm-active { background: #ff2e63 !important; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <h1>🔑 VõtmeValvur Pro</h1>
    <div class="status-box" id="display-box">
        <p>Signaali:</p>
        <div id="rssi-val">--</div>
        <p>Aku Tase:</p>
        <div id="battery-val" style="font-size: 24px; color: #a2ffb6; font-weight: bold;">-- %</div>
        <p id="info-text">Ühendamata</p>
    </div>
    <button class="btn" onclick="connectTracker()">Sünkroniseeri Võtmehoidja</button>
    
    <audio id="alarm-sound" src="https://google.com" loop></audio>

    <script>
        let trackingInterval = null;
        const TARGET_SERVICE_UUID = "91a13460-a123-4b77-8c44-fa867201b12a";
        const TARGET_CHAR_UUID    = "1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d";

        async function connectTracker() {
            try {
                document.getElementById("info-text").innerText = "Otsib...";
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: "VOTME_VALVUR_PRO" }],
                    optionalServices: [TARGET_SERVICE_UUID]
                });
                const server = await device.gatt.connect();
                document.getElementById("info-text").innerText = "Ühendatud!";
                
                const service = await server.getPrimaryService(TARGET_SERVICE_UUID);
                const characteristic = await service.getCharacteristic(TARGET_CHAR_UUID);
                const value = await characteristic.readValue();
                document.getElementById("battery-val").innerText = value.getUint8(0) + " %";

                const alarm = document.getElementById("alarm-sound");
                alarm.play(); alarm.pause(); 

                if(trackingInterval) clearInterval(trackingInterval);
                trackingInterval = setInterval(() => {
                    if (device.gatt.connected) {
                        document.getElementById("rssi-val").innerText = "OK";
                        triggerAlarm(false);
                    } else {
                        document.getElementById("rssi-val").innerText = "LOST";
                        triggerAlarm(true);
                    }
                }, 2500);
            } catch (error) { 
                document.getElementById("info-text").innerText = "Tõrge ühendamisel.";
                console.log(error); 
            }
        }

        function triggerAlarm(active) {
            const box = document.getElementById("display-box");
            const alarm = document.getElementById("alarm-sound");
            if (active) { 
                box.classList.add("alarm-active"); 
                alarm.play(); 

                // Automatic background alert request pushed out through Webpushr custom key framework
                if(typeof webpushr !== 'undefined') {
                    webpushr('fetch', {
                        title: '🔑 VõtmeValvur Hoiatus',
                        message: 'Unustasid oma võtmed maha! Naase tagasi.',
                        target_url: window.location.href
                    });
                }

            } else { 
                box.classList.remove("alarm-active"); 
                alarm.pause(); 
            }
        }
    </script>

    <!-- Start Webpushr Native Tracking SDK Integration --> 
    <script>
        (function(w,d, s, id) {if(typeof(w.webpushr)!=='undefined') return;w.webpushr=w.webpushr||function(){(w.webpushr.q=w.webpushr.q||[]).push(arguments)};var js, fjs = d.getElementsByTagName(s)[0];js = d.createElement(s); js.id = id;js.async=1;js.src = "https://cdn.webpushr.com/app.min.js";fjs.parentNode.appendChild(js);}(window,document, 'script', 'webpushr-jssdk'));
        webpushr('setup',{'key':'BG3bjup03sqZoj3tNKoqGjeycRkQBUuQGoUHkIU9yDvGLeCDmTBMVLGnU9M5g2gEfwlW_9TkTCdnYPhb8SnkyHU' });
    </script>
    <!-- End Webpushr Integration -->

</body>
</html>
